services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobmail_db
    environment:
      POSTGRES_USER: jobmail
      POSTGRES_PASSWORD: jobmail
      POSTGRES_DB: jobmail_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmail -d jobmail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jobmail_backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: jobmail_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
